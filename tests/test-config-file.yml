name: Test config_file disables a rule
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown violating only MD013 and a config disabling it
        run: |
          rm -rf md-config
          mkdir -p md-config/docs
          LONG="This line is intentionally very long so that it exceeds the default markdownlint line length limit of eighty characters."
          printf '# Long Line Doc\n\n%s\n' "$LONG" > md-config/docs/long.md
          printf '{\n  "MD013": false\n}\n' > md-config/markdownlint.json
          chmod -R a+rX md-config
      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: md-config/docs
          config_file: md-config/markdownlint.json
      - name: Assert lint succeeded with config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with MD013 disabled via config_file"
            exit 1
          fi
          echo "PASS"
