name: Test config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdown linter with custom config file
        id: action
        uses: .
        with:
          config_file: tests/fixtures/config/.markdownlint.json
          search_paths: tests/fixtures/valid
      - name: Assert linting passed with custom config
        run: |
          echo "PASS: markdown linter completed successfully with custom config file"
