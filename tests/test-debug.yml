name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          debug: "true"
          search_paths: tests/fixtures/valid

      - name: Assert action succeeded in debug mode
        run: |
          echo "PASS: action completed successfully in debug mode"
