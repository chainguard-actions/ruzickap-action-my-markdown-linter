name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with debug enabled
        id: action
        uses: .
        with:
          debug: "true"
          search_paths: ${{ github.workspace }}/tests/fixtures/debug/docs

      - name: Assert linter passed in debug mode
        run: |
          echo "PASS: linter completed successfully in debug mode"
