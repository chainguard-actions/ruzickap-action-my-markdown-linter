name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create valid markdown
        run: |
          rm -rf md-debug
          mkdir -p md-debug
          printf '# Debug Doc\n\nValid text.\n' > md-debug/doc.md
          chmod -R a+rX md-debug
      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: md-debug
          debug: "true"
      - name: Assert lint succeeded in debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success in debug mode"
            exit 1
          fi
          echo "PASS"
