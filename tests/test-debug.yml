name: Test markdown linting with debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run linter with debug mode enabled
        id: action
        uses: .
        with:
          debug: "true"
          fd_cmd_params: >-
            . ${{ github.workspace }}/pristine/ruzickap--action-my-markdown-linter/v1.2.0/tests/fixtures/valid
            -0 --extension md --type f --hidden --no-ignore --exclude .git/

      - name: Assert debug linting succeeded
        run: |
          echo "Linting in debug mode completed successfully"
          echo "PASS"
