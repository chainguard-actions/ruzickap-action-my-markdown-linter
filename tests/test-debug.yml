name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create valid markdown file for debug test
        run: |
          mkdir -p /tmp/md-debug
          cat > /tmp/md-debug/test.md << 'EOF'
          # Debug Test

          This is a test markdown file for debug mode.

          ## Section

          Content here.
          EOF

      - name: Run markdown linter with debug enabled
        id: action
        uses: .
        with:
          debug: "true"
          fd_cmd_params: /tmp/md-debug -0 --extension md --type f --hidden --no-ignore --exclude .git/

      - name: Assert debug linting succeeded
        run: |
          echo "Linting in debug mode completed successfully"
          echo "PASS"
