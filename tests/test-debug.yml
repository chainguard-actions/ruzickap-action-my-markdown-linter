name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint markdown files with debug enabled
        id: action
        uses: .
        with:
          debug: "true"
          search_paths: |
            pristine/ruzickap--action-my-markdown-linter/v1.3.1/tests/fixtures/valid/

      - name: Assert linting passed in debug mode
        run: |
          echo "PASS: Markdown linting completed successfully in debug mode"
