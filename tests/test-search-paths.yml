name: Test search_paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdown linter on specific search path
        id: action
        uses: .
        with:
          search_paths: tests/fixtures/valid
      - name: Assert linting passed on specific path
        run: |
          echo "PASS: markdown linter completed successfully on specific search path"
