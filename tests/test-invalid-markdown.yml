name: Test invalid markdown - linting should fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid markdown file (multiple H1 headings - MD025)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/invalid-md"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/invalid-md/bad.md" << 'EOF'
          # First Heading

          Some content.

          # Second Heading

          More content.
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: tests/fixtures/invalid-md

      - name: Assert linting failed on invalid markdown
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: markdownlint correctly failed on invalid markdown"
          else
            echo "FAIL: expected markdownlint to fail on invalid markdown but got outcome '$OUTCOME'"
            exit 1
          fi
