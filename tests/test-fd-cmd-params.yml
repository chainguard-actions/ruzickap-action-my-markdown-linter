name: Test fd_cmd_params - custom fd command parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with custom fd_cmd_params (only scan docs dir)
        id: action
        uses: .
        with:
          fd_cmd_params: "${{ github.workspace }}/tests/fixtures/fd-cmd-params/docs -0 --extension md --type f --hidden --no-ignore --exclude .git/"

      - name: Assert linter passed with custom fd params
        run: |
          echo "PASS: linter completed successfully with custom fd_cmd_params (only scanned docs, skipped bad files)"
