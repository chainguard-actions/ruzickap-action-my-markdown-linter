name: Test fd_cmd_params input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdown linter with custom fd command params
        id: action
        uses: .
        with:
          fd_cmd_params: ". -0 --extension md --type f --hidden --no-ignore --exclude .git/ tests/fixtures/valid"
      - name: Assert linting passed with custom fd params
        run: |
          echo "PASS: markdown linter completed successfully with custom fd_cmd_params"
