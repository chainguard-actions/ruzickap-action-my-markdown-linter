name: Test fd_cmd_params - custom fd command parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"
      - id: action
        uses: .
        with:
          # Use fd_cmd_params to only scan the valid fixtures directory
          # When fd_cmd_params is set, exclude and search_paths are ignored
          fd_cmd_params: tests/fixtures/valid -0 --extension md --type f --hidden --no-ignore --exclude .git/
      - name: Assert action succeeded with custom fd params
        run: |
          echo "PASS: action completed successfully with custom fd_cmd_params"
