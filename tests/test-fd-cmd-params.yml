name: Test fd_cmd_params custom parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with custom fd command parameters
        id: action
        uses: .
        with:
          fd_cmd_params: >-
            pristine/ruzickap--action-my-markdown-linter/v1.0.9/tests/fixtures
            -0
            --extension md
            --type f

      - name: Assert linting succeeded with custom fd params
        run: |
          echo "Linting completed successfully with custom fd_cmd_params"
          echo "PASS"
