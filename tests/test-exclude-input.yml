name: Test markdown linting with exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create markdown files including one that would fail linting
        run: |
          mkdir -p /tmp/md-exclude-input-test/good
          mkdir -p /tmp/md-exclude-input-test/skip

          # Valid markdown file
          cat > /tmp/md-exclude-input-test/good/valid.md << 'EOF'
          # Good Markdown

          This is a valid markdown file.

          ## Section

          Some content here.
          EOF

          # Invalid markdown file (missing blank line after heading)
          # This file would fail linting but will be excluded via the exclude input
          printf '# Bad Markdown\nno blank line after heading\n## another heading without blank line\nmore text\n' > /tmp/md-exclude-input-test/skip/invalid.md

      - name: Run markdown linter with exclude input
        id: action
        uses: .
        with:
          search_paths: /tmp/md-exclude-input-test
          exclude: /tmp/md-exclude-input-test/skip

      - name: Assert linting passed (skip directory was excluded)
        run: |
          echo "Linting with exclude input completed successfully"
          echo "PASS"
