name: Test basic usage - lint valid markdown
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter on committed fixture file
        id: action
        uses: .
        with:
          fd_cmd_params: >-
            ${{ github.workspace }}/pristine/ruzickap--action-my-markdown-linter/v1.1.0/tests/fixtures
            -0 --extension md --type f --hidden --no-ignore --exclude .git/

      - name: Assert linting succeeded
        run: |
          echo "Linting completed successfully"
          echo "PASS"
