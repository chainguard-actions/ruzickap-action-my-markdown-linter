name: Test basic usage - lint valid markdown files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter on valid files
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/valid/docs

      - name: Assert linter passed
        run: |
          echo "PASS: linter completed successfully on valid markdown"
