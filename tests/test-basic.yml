name: Test basic markdown linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid markdown file to lint
        run: |
          mkdir -p /tmp/md-test
          cat > /tmp/md-test/valid.md << 'EOF'
          # Hello World

          This is a valid markdown file.

          ## Section Two

          Some content here.
          EOF

      - name: Run markdown linter on specific path
        id: action
        uses: .
        with:
          search_paths: /tmp/md-test

      - name: Assert linting succeeded
        run: |
          echo "PASS: Markdown linting completed successfully"
