name: Test exclude input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run markdown linter excluding invalid directory
        id: action
        uses: .
        with:
          exclude: invalid
          search_paths: tests/fixtures
      - name: Assert linting passed after exclusion
        run: |
          echo "PASS: markdown linter completed successfully with exclusion"
