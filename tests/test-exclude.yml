name: Test exclude parameter - excluded files are not linted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with exclude
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/exclude
          exclude: skip

      - name: Assert linter passed (excluded bad files)
        run: |
          echo "PASS: linter completed successfully - bad files were excluded"
