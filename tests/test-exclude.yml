name: Test exclude files from linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter excluding the CHANGELOG.md
        id: action
        uses: .
        with:
          exclude: CHANGELOG.md
          search_paths: pristine/ruzickap--action-my-markdown-linter/v1.0.9/tests/fixtures

      - name: Assert linting succeeded with exclusion
        run: |
          echo "Linting completed successfully with exclusions applied"
          echo "PASS"
