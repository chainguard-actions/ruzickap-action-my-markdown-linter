name: Test exclude files from linting
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          exclude: vendor
          search_paths: tests/fixtures/mixed

      - name: Assert action succeeded with exclusion
        run: |
          echo "PASS: action completed successfully - vendor directory was excluded"
