name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with custom config file
        id: action
        uses: .
        with:
          config_file: pristine/ruzickap--action-my-markdown-linter/v1.0.9/tests/fixtures/custom-markdownlint.yml
          search_paths: pristine/ruzickap--action-my-markdown-linter/v1.0.9/tests/fixtures

      - name: Assert linting succeeded with custom config
        run: |
          echo "Linting completed successfully with custom config file"
          echo "PASS"
