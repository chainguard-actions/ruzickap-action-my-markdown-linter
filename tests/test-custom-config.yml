name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          config_file: tests/fixtures/config/custom-markdownlint.yml
          search_paths: tests/fixtures/longline

      - name: Assert action succeeded with custom config
        run: |
          echo "PASS: action completed successfully with custom config (MD013 disabled)"
