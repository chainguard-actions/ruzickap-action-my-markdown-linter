name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom markdownlint config and markdown file
        run: |
          mkdir -p /tmp/md-custom
          # Create a permissive config that disables line length check
          cat > /tmp/md-custom/.markdownlint.yml << 'EOF'
          ---
          MD013: false
          EOF
          # Create a markdown file with long lines (would fail default MD013 check)
          cat > /tmp/md-custom/long-lines.md << 'EOF'
          # Long Lines Test

          This is a very long line that would normally fail the MD013 line length check but we have disabled it in our custom config file so it should pass just fine without any issues at all.
          EOF

      - name: Run markdown linter with custom config
        id: action
        uses: .
        with:
          config_file: /tmp/md-custom/.markdownlint.yml
          fd_cmd_params: /tmp/md-custom -0 --extension md --type f --hidden --no-ignore --exclude .git/

      - name: Assert linting with custom config succeeded
        run: |
          echo "Linting with custom config completed successfully"
          echo "PASS"
