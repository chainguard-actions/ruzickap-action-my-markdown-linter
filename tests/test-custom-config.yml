name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run markdown linter with custom config
        id: action
        uses: .
        with:
          config_file: ${{ github.workspace }}/tests/fixtures/custom-config/custom-markdownlint.yml
          search_paths: ${{ github.workspace }}/tests/fixtures/custom-config/docs

      - name: Assert linter passed with custom config
        run: |
          echo "PASS: linter completed successfully with custom config"
