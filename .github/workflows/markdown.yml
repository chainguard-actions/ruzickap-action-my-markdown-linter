name: markdown

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.md'
      - .github/workflows/markdown.yml
      - .markdownlint.yml
  push:
    branches:
      - main
    paths:
      - '**.md'
      - .github/workflows/markdown.yml
      - .markdownlint.yml

permissions:
  contents: read

jobs:
  markdown_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Markdown Lint
        uses: ruzickap/action-my-markdown-linter@abb659d26eea70aee77a555bd057b9c45ddd3332 # v1
        with:
          exclude: |
            tests/
            CHANGELOG.md

      - name: Markdown Lint using pre-built container
        uses: docker://peru/my-markdown-linter:latest@sha256:5aef6ec78244a51c6633d9829e9636fd7156a362eb0c512e146411d99980146e
        with:
          exclude: |
            tests/
            CHANGELOG.md

  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Link Checker
        uses: ruzickap/action-my-markdown-link-checker@dfc79f055da63c13fc3b95ae67b46dce2b99a44b # v1
        with:
          exclude: |
            CHANGELOG.md
