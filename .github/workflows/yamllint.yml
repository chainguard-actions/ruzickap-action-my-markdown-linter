name: yamllint

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.yml'
      - '**.yaml'
  push:
    branches:
      - main
    paths:
      - '**.yml'
      - '**.yaml'

permissions:
  contents: read

jobs:
  yamllint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3
